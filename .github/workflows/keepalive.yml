name: Keep Supabase awake
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep SUPABASE_URL supabase-config.js | sed 's/.*= *"\(.*\)".*/\1/')
          KEY=$(grep SUPABASE_ANON_KEY supabase-config.js | sed 's/.*= *"\(.*\)".*/\1/')
          curl -fsS "$URL/rest/v1/progress?select=user_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
